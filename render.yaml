services:
  - type: web
    name: hayqyan-travel
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /data/submissions.db
    disk:
      name: hayqyan-data
      mountPath: /data
      sizeGB: 1
